services:
  luma:
    build: .
    container_name: luma
    environment:
      TZ: Asia/Shanghai
      LUMA_LLM_API_KEY: ${LUMA_LLM_API_KEY}
      LUMA_EMBEDDING_API_KEY: ${LUMA_EMBEDDING_API_KEY:-}
      LUMA_VISION_API_KEY: ${LUMA_VISION_API_KEY:-}
      LUMA_ONEBOT_TOKEN: ${LUMA_ONEBOT_TOKEN:-}
      LUMA_MYSQL_PASSWORD: ${LUMA_MYSQL_PASSWORD}
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./config/mcp.json:/app/config/mcp.json:ro
      - sticker_data:/app/stickers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${LUMA_HTTP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: luma-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: luma
      MYSQL_ROOT_PASSWORD: ${LUMA_MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: luma-etcd
    profiles: ["vector"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: luma-minio
    profiles: ["vector"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: luma-milvus
    profiles: ["vector"]
    command:
      - milvus
      - run
      - standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

volumes:
  sticker_data:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
