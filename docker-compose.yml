services:
  mumu-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mumu-bot
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_started
      minio:
        condition: service_started
      milvus:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      MUMU_LLM_API_KEY: ${MUMU_LLM_API_KEY:-}
      MUMU_AUX_LLM_API_KEY: ${MUMU_AUX_LLM_API_KEY:-}
      MUMU_EMBEDDING_API_KEY: ${MUMU_EMBEDDING_API_KEY:-}
      MUMU_VISION_API_KEY: ${MUMU_VISION_API_KEY:-}
      MUMU_MYSQL_PASSWORD: ${MUMU_MYSQL_PASSWORD:-mumu_local_pwd}
      MUMU_ONEBOT_TOKEN: ${MUMU_ONEBOT_TOKEN:-}
    ports:
      - "${MUMU_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
      - ./config/mcp.example.json:/app/config/mcp.json:ro
      - ./data/stickers:/app/stickers
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mumu-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: mumu_bot
      MYSQL_ROOT_PASSWORD: ${MUMU_MYSQL_PASSWORD:-mumu_local_pwd}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: mumu-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: mumu-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: minio server /minio_data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: mumu-milvus
    command:
      - milvus
      - run
      - standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
