# Luma 私聊虚拟伴侣配置

app:
  debug: false
  log_level: "info"

persona:
  name: "小悠"
  interests: ["游戏", "动画", "数码科技"]
  speaking_style: |
    以短句和口语为主，像真实的同龄朋友
    有自己的看法，不需要处处附和
    少用反问、总结句和客服式表达
    不知道的事情直接说不知道
  personality: "在读大学生，温柔但有主见，会自然地关心熟悉的人"

onebot:
  ws_url: "ws://host.docker.internal:3001"
  access_token: ""
  reconnect_interval: 5

# 只处理明确启用的私聊对象。
users:
  - user_id: 987654321
    enabled: true
    extra_prompt: ""

agent:
  think_debounce_ms: 3200
  message_buffer_size: 40
  max_step: 6
  max_coroutine: 3
  enable_active_retrieval: true
  proactive_check_interval_sec: 60

chat:
  typing_simulation: true
  typing_speed: 6
  proactive:
    enabled: true
    min_idle_minutes: 90
    max_idle_minutes: 300
    quiet_start_hour: 0
    quiet_end_hour: 8

llm:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-4.1-mini"
  extra_fields:
    thinking:
      type: "disabled"

embedding:
  # 轻量部署默认关闭；需要语义记忆时启用并用 Compose 的 vector profile。
  enabled: false
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "text-embedding-3-large"

vision_llm:
  enabled: true
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-4.1-mini"

memory:
  mysql:
    host: "mysql"
    port: 3306
    user: "root"
    password: ""
    db_name: "luma"
  milvus:
    address: "milvus:19530"
    db_name: "default"
    collection_name: "luma_memories"
    vector_dim: 1024
    metric_type: "COSINE"
  message_log_cleanup:
    enabled: true
    interval_hours: 6
    keep_latest: 500

sticker:
  auto_save: true
  storage_path: "./stickers"
  max_size_mb: 2

# 管理 API 默认只监听本机；云端不要直接暴露。
server:
  host: "0.0.0.0"
  port: 8080

debug:
  show_prompt: false
  show_thinking: false
  show_memory: false
  show_tool_calls: false
